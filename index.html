<body>
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <ul>
      <li><a href="#" onclick="loadSection('dashboard')">Dashboard</a></li>
      <li><a href="#" onclick="loadSection('addProduct')">Add Product</a></li>
      <li><a href="#" onclick="loadSection('orders')">Orders</a></li>
      <li><a href="#" onclick="logout()">Logout</a></li>
    </ul>
  </div>

  <div class="main" id="mainContent"></div>

  <script>
    function loadSection(section) {
      document.getElementById('mainContent').innerHTML = '';
      document.getElementById('section-style').href = `${section}.css`;
      setTimeout(() => {
        if (section === 'dashboard') renderDashboard();
        else if (section === 'addProduct') renderAddProduct();
        else if (section === 'orders') renderOrders();
      }, 100); // delay to ensure JS file is loaded if needed
    }

    window.onload = () => loadSection('dashboard');
  </script>
</body>
